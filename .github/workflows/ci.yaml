name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-trixie
        env:
          POSTGRES_DB: ntauth
          POSTGRES_PASSWORD: ntauth
          POSTGRES_USER: ntauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ntauth -d ntauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.8.1-alpine3.23
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ntauth:ntauth@127.0.0.1:5432/ntauth
      REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgres://ntauth:ntauth@127.0.0.1:5432/ntauth

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Restore Bun download cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Validate formatting, lint, types, tests, and builds
        run: bun run check
