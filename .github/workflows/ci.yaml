name: CI

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".release-please-manifest.json"
      - ".npmrc"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "Dockerfile"
      - "apps/**"
      - "bun.lock"
      - "compose*.yaml"
      - "deploy/**"
      - "examples/**"
      - "package.json"
      - "packages/**"
      - "release-please-config.json"
      - "tooling/**"
      - "tsconfig.json"
      - "turbo.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".release-please-manifest.json"
      - ".npmrc"
      - ".oxfmtrc.json"
      - ".oxlintrc.json"
      - "Dockerfile"
      - "apps/**"
      - "bun.lock"
      - "compose*.yaml"
      - "deploy/**"
      - "examples/**"
      - "package.json"
      - "packages/**"
      - "release-please-config.json"
      - "tooling/**"
      - "tsconfig.json"
      - "turbo.json"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-trixie@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
        env:
          POSTGRES_DB: ntauth_test
          POSTGRES_PASSWORD: ntauth
          POSTGRES_USER: ntauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ntauth -d ntauth_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8.10.0-alpine3.23@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://ntauth:ntauth@127.0.0.1:5432/ntauth_test
      REDIS_URL: redis://127.0.0.1:6379
      TEST_DATABASE_URL: postgres://ntauth:ntauth@127.0.0.1:5432/ntauth_test

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-1.3.14-turbo-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-turbo-${{ hashFiles('bun.lock') }}-

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Validate formatting, lint, types, tests, and builds
        run: bun run check
