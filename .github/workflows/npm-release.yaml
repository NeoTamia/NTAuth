name: npm release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Restore Bun download cache
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.14-${{ hashFiles('bun.lock') }}

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository
        run: bun run check

      - name: Inspect package exports and tarballs
        run: bun run release:verify

      - name: Require release-ready versions
        if: github.event_name == 'push'
        run: bun run release:verify --publish

      - name: Prepare shared registry artifacts
        run: bun run release:prepare

      - name: Verify registry mirror without publishing
        if: github.event_name != 'push'
        run: bun run release:publish --dry-run

      - name: Publish identical artifacts to npm and GitHub Packages
        if: github.event_name == 'push'
        run: bun run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
