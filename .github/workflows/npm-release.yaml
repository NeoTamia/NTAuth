name: npm release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write
  packages: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    name: Verify and publish npm packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NPM_CONFIG_PROVENANCE: "true"

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Restore Bun download cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-1.3.14-turbo-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.14-turbo-${{ hashFiles('bun.lock') }}-

      - name: Install exact dependencies
        run: bun install --frozen-lockfile

      - name: Validate repository
        run: bun run check

      - name: Inspect package exports and tarballs
        run: bun run release:verify

      - name: Require release-ready versions
        if: github.event_name == 'push'
        run: bun run release:verify --publish

      - name: Prepare shared registry artifacts
        run: bun run release:prepare

      - name: Verify registry mirror without publishing
        if: github.event_name != 'push'
        run: bun run release:publish --dry-run

      - name: Publish identical artifacts to npm and GitHub Packages
        if: github.event_name == 'push'
        run: bun run release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
