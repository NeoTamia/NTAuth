name: ntauth-production

x-runtime: &runtime
  init: true
  restart: unless-stopped
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:size=64m,mode=1777
  stop_grace_period: 30s

services:
  postgres:
    image: postgres:18.6-trixie@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    environment:
      POSTGRES_DB: ntauth
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_USER: ntauth
    secrets:
      - postgres_password
    networks:
      - data
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ntauth -d ntauth"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    shm_size: 256mb
    mem_limit: 1g
    cpus: 1.5

  redis:
    image: redis:8.10.0-alpine3.23@sha256:978f0e01593e65eed801f2402944efcd936d43b5027e4908a7897baf88ed6241
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    networks:
      - data
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.75

  migrate: &migration-job
    <<: *runtime
    image: ${IMAGE_REGISTRY:-ghcr.io/neotamia}/ntauth-migrate@${MIGRATE_IMAGE_DIGEST:?set MIGRATE_IMAGE_DIGEST}
    command: ["up"]
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    networks:
      - data
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    mem_limit: 256m
    cpus: 0.5

  bootstrap-admin:
    <<: *migration-job
    profiles: ["bootstrap"]
    entrypoint: ["bun", "dist/bootstrap-admin-cli.js"]
    command: []
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      NTAUTH_BOOTSTRAP_ADMIN_EMAIL: ${NTAUTH_BOOTSTRAP_ADMIN_EMAIL:-}
      NTAUTH_BOOTSTRAP_ADMIN_NAME: ${NTAUTH_BOOTSTRAP_ADMIN_NAME:-NTAuth Administrator}
      NTAUTH_BOOTSTRAP_ADMIN_PASSWORD_FILE: /run/secrets/bootstrap_admin_password
      NTAUTH_BOOTSTRAP_CONFIRM: ${NTAUTH_BOOTSTRAP_CONFIRM:-}
    secrets:
      - bootstrap_admin_password
      - database_url

  api:
    <<: *runtime
    image: ${IMAGE_REGISTRY:-ghcr.io/neotamia}/ntauth-api@${API_IMAGE_DIGEST:?set API_IMAGE_DIGEST}
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 3001
      AUTH_BASE_URL: ${AUTH_BASE_URL:?set AUTH_BASE_URL}
      BETTER_AUTH_SECRET_FILE: /run/secrets/better_auth_secret
      CORS_ORIGINS: ${CORS_ORIGINS:?set CORS_ORIGINS}
      DATABASE_URL_FILE: /run/secrets/database_url
      NODE_ENV: production
      RATE_LIMIT_ENABLED: "true"
      REDIS_URL: redis://redis:6379
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?set TRUSTED_PROXY_CIDRS}
    secrets:
      - better_auth_secret
      - database_url
    expose:
      - "3001"
    networks:
      - data
      - edge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:3001/ready');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  worker:
    <<: *runtime
    image: ${IMAGE_REGISTRY:-ghcr.io/neotamia}/ntauth-worker@${WORKER_IMAGE_DIGEST:?set WORKER_IMAGE_DIGEST}
    environment:
      DATABASE_URL_FILE: /run/secrets/database_url
      EMAIL_OUTBOX_POLL_INTERVAL_MS: 1000
      JOB_LOCK_TIMEOUT_MS: 30000
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      SMTP_FROM: ${SMTP_FROM:?set SMTP_FROM}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST}
      SMTP_PASSWORD_FILE: /run/secrets/smtp_password
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      SMTP_USER: ${SMTP_USER:?set SMTP_USER}
      WORKER_HOST: 0.0.0.0
      WORKER_PORT: 3002
    secrets:
      - database_url
      - smtp_password
    networks:
      - data
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://localhost:3002/ready');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 512m
    cpus: 1.0

  web:
    <<: *runtime
    image: ${IMAGE_REGISTRY:-ghcr.io/neotamia}/ntauth-web@${WEB_IMAGE_DIGEST:?set WEB_IMAGE_DIGEST}
    environment:
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:?set NUXT_PUBLIC_API_BASE_URL}
    expose:
      - "3000"
    networks:
      - edge
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD", "bun", "-e", "const r=await fetch('http://localhost:3000/');process.exit(r.ok?0:1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    mem_limit: 384m
    cpus: 0.75

  prometheus:
    image: prom/prometheus:v3.13.2@sha256:508729e0e2d18e11fd742a5a5ca70e557b940a93948c3c95fd0123a6fd538b69
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
      - --web.enable-lifecycle
    networks:
      - data
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75

  alertmanager:
    image: prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    networks:
      - data
    volumes:
      - ./deploy/observability/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    cpus: 0.5

  grafana:
    image: grafana/grafana:13.1.3@sha256:ab5cb380e3ff3172d6c8bd2e7cfd31cce977d2881b260e1f5bc089bf0b759b43
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
    secrets:
      - grafana_admin_password
    expose:
      - "3000"
    networks:
      - data
      - edge
    volumes:
      - ./deploy/observability/grafana:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 384m
    cpus: 0.75

networks:
  data:
    internal: true
  edge:
    external: true
    name: ${EDGE_NETWORK:-proxy}

secrets:
  bootstrap_admin_password:
    file: ${NTAUTH_BOOTSTRAP_ADMIN_PASSWORD_FILE:-./deploy/secrets/bootstrap-admin-password}
  better_auth_secret:
    file: ${BETTER_AUTH_SECRET_FILE:-./deploy/secrets/better-auth-secret}
  database_url:
    file: ${DATABASE_URL_FILE:-./deploy/secrets/database-url}
  postgres_password:
    file: ${POSTGRES_PASSWORD_FILE:-./deploy/secrets/postgres-password}
  smtp_password:
    file: ${SMTP_PASSWORD_FILE:-./deploy/secrets/smtp-password}
  grafana_admin_password:
    file: ${GRAFANA_ADMIN_PASSWORD_FILE:-./deploy/secrets/grafana-admin-password}

volumes:
  postgres-data:
  redis-data:
  alertmanager-data:
  grafana-data:
  prometheus-data:
